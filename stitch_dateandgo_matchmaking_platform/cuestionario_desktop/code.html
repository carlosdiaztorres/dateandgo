<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('questionnaire-form');
            const nextBtn = document.getElementById('next-button');
            const radioInputs = form.querySelectorAll('input[type="radio"]');

            // Initial state
            nextBtn.disabled = true;

            radioInputs.forEach(input => {
                input.addEventListener('change', () => {
                    nextBtn.disabled = false;
                    
                    // Visual feedback for diamond indicator
                    radioInputs.forEach(other => {
                        const diamond = other.closest('label').querySelector('.diamond-indicator');
                        if (other.checked) {
                            diamond.classList.add('bg-primary');
                            diamond.classList.remove('bg-transparent');
                        } else {
                            diamond.classList.remove('bg-primary');
                            diamond.classList.add('bg-transparent');
                        }
                    });
                });
            });

            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // Simulation of transition
                document.querySelector('main').style.opacity = '0';
                document.querySelector('main').style.transform = 'translateY(-20px)';
                document.querySelector('main').style.transition = 'all 0.5s ease-in-out';
                
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    // Logical redirection or state update would happen here
                    alert('Navegando al siguiente paso de la consulta...');
                    document.querySelector('main').style.opacity = '1';
                    document.querySelector('main').style.transform = 'translateY(0)';
                }, 500);
            });
        });
    </script>
