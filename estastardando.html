<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <title>Tu historia empieza aquí · DateAndGo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script async src="https://tally.so/widgets/embed.js"></script>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: #f8f9ff;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
      color: #0b1c30;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      padding: 48px 16px 64px;
    }

    /* ── WRAPPER ── */
    .wrapper {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── LOGO ── */
    .logo-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-header a { text-decoration: none; display: inline-block; }
    .logo-header img { width: 150px; height: auto; display: block; margin: 0 auto; }

    /* ── CARD ── */
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(70, 72, 212, 0.07);
      border: 1px solid #e5eeff;
      padding: 48px 44px 40px;
    }

    /* ── CHIP ── */
    .chip {
      display: inline-block;
      background-color: #e1e0ff;
      color: #4648d4;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── CARD TITLE / INTRO ── */
    .card-title {
      font-size: 28px;
      font-weight: 800;
      color: #0b1c30;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .card-intro {
      font-size: 15px;
      color: #464554;
      line-height: 1.65;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1.5px solid #e5eeff;
    }

    /* ── TALLY IFRAME ── */
    .tally-wrap {
      width: 100%;
    }
    .tally-wrap iframe {
      width: 100%;
      border: none;
      display: block;
    }

    /* ── SIGN-OFF ── */
    .sign-off {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1.5px solid #e5eeff;
    }
    .sign-off .tagline {
      font-size: 16px;
      font-weight: 800;
      color: #4648d4;
      line-height: 1.4;
    }
    .sign-off .team {
      font-size: 14px;
      color: #767586;
      font-weight: 500;
      margin-top: 4px;
    }

    /* ── PHOTO STRIP (bottom) ── */
    .photo-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 40px;
      border-radius: 14px;
      overflow: hidden;
    }
    .photo-strip img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .photo-strip img:hover { transform: scale(1.03); }
    .photo-strip img:first-child { border-radius: 14px 0 0 14px; }
    .photo-strip img:last-child  { border-radius: 0 14px 14px 0; }

    .photo-credits {
      text-align: center;
      font-size: 11px;
      color: #9896a8;
      margin-top: 10px;
      letter-spacing: 0.02em;
    }
    .photo-credits a { color: #9896a8; text-decoration: none; }
    .photo-credits a:hover { color: #4648d4; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #9896a8;
      line-height: 1.6;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      body { padding: 24px 12px 48px; }
      .card { padding: 28px 18px 28px; border-radius: 14px; }
      .card-title { font-size: 22px; }
      .photo-strip { grid-template-columns: repeat(2, 1fr); }
      .photo-strip img { height: 140px; }
      .photo-strip img:first-child { border-radius: 14px 0 0 0; }
      .photo-strip img:nth-child(2) { border-radius: 0 14px 0 0; }
      .photo-strip img:nth-child(3) { border-radius: 0 0 0 14px; }
      .photo-strip img:last-child   { border-radius: 0 0 14px 0; }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- LOGO -->
    <div class="logo-header">
      <a href="http://www.dateandgo.es" target="_blank">
        <img src="https://raw.githubusercontent.com/carlosdiaztorres/dateandgo/main/logo.png" alt="DateAndGo Logo" />
      </a>
    </div>

    <!-- MAIN CARD -->
    <div class="card">

      <!-- TALLY FORM EMBED -->
      <div class="tally-wrap">
        <iframe
          data-tally-src="https://tally.so/r/KYOWL8?transparentBackground=1"
          width="100%"
          height="800"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          title="Tu historia empieza aquí">
        </iframe>
      </div>

      <!-- SIGN-OFF -->
      <div class="sign-off">
        <p class="tagline">Menos chat, más citas.</p>
        <p class="team">— Equipo DateAndGo</p>
      </div>

    </div><!-- /card -->

    <!-- PHOTO STRIP -->
    <div class="photo-strip">
      <img src="fotos-cuestionario/photo-1742327648139-2f81d97d6d7e.avif" alt="Pareja feliz" />
      <img src="fotos-cuestionario/photo-1578399635441-df4d3b19a160.avif" alt="Pareja íntima" />
      <img src="fotos-cuestionario/photo-1514480657081-a987d9a45e90.avif" alt="Pareja en el campo" />
      <img src="fotos-cuestionario/photo-1501901609772-df0848060b33.avif" alt="Pareja riendo" />
    </div>
    <p class="photo-credits">
      Fotos: <a href="https://unsplash.com/@micahandsammiechaffin" target="_blank">@micahandsammiechaffin</a> ·
      <a href="https://unsplash.com/@heftiba" target="_blank">@heftiba</a> ·
      <a href="https://unsplash.com/@carlyrae" target="_blank">@carlyrae</a> ·
      <a href="https://unsplash.com/@vapricot" target="_blank">@vapricot</a>
    </p>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 DateAndGo. Todos los derechos reservados.
    </div>

  </div><!-- /wrapper -->

  <script>
    // Tally auto-resize: ajusta el iframe al alto real del formulario
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'tally-form-loaded') {
        var iframe = document.querySelector('.tally-wrap iframe');
        if (iframe) iframe.style.height = e.data.height + 'px';
      }
    });
  </script>

</body>
</html>
